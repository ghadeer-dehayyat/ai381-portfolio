name: train-and-gate

on:
  pull_request:
    branches: [main]
    paths:
      - "labs/lab-03/**"
      - ".github/workflows/train.yml"
  push:
    branches: [main]
    paths:
      - "labs/lab-03/**"
      - ".github/workflows/train.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate:
    name: train and gate
    runs-on: ubuntu-latest
    env:
      MLFLOW_TRACKING_URI: http://localhost:5000
      GIT_SHA: ${{ github.sha }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: labs/lab-03/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt
        working-directory: labs/lab-03

      - name: Start MLflow
        run: docker compose -f docker-compose.mlflow.yml up -d --wait
        working-directory: labs/lab-03

      - name: Find the champion to beat
        run: |
          BASE="${{ github.event.pull_request.base.sha || github.event.before }}"
          git show "${BASE:-HEAD~1}:labs/lab-03/artifacts/champion.json" > "$RUNNER_TEMP/champion.json" 2>/dev/null \
            && echo "Champion found:" && cat "$RUNNER_TEMP/champion.json" \
            || { echo "No champion on the base yet: the first good model will be promoted."; rm -f "$RUNNER_TEMP/champion.json"; }

      - name: Train the candidates
        run: |
          echo "BATCH=${GITHUB_SHA::7}" >> "$GITHUB_ENV"
          BATCH="${GITHUB_SHA::7}" python -m src.train.train_mlflow
        working-directory: labs/lab-03

      - name: Promotion gate
        run: python scripts/promote.py --champion-file "$RUNNER_TEMP/champion.json"
        working-directory: labs/lab-03

      - name: Summary
        if: always()
        run: |
          {
            echo "### Gate"
            echo "Batch \`${GITHUB_SHA::7}\`. See the step above for PROMOTED or BLOCKED."
            echo "To record a promotion, commit \`labs/lab-03/artifacts/champion.json\`, \`metadata.json\` and \`model.joblib\` from your own run of \`scripts/promote.py\`."
          } >> "$GITHUB_STEP_SUMMARY"
