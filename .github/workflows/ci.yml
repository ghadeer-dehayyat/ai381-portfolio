
name: AI381 Lab 2 CI

on:
  pull_request:
    branches:
      - main
    paths:
      - "labs/lab-02/**"
      - ".github/workflows/ci.yml"

  push:
    branches:
      - main
    paths:
      - "labs/lab-02/**"
      - ".github/workflows/ci.yml"

permissions:
  contents: read

jobs:
  test:
    name: Lint and Test
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: labs/lab-02

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run Ruff
        run: ruff check src tests

      - name: Run Pytest
        run: pytest -v

  docker:
    name: Build, Scan and Push Docker Image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1

      - name: Build Docker image
        uses: docker/build-push-action@ca877d9245402d1537745e0e356eab47c3520991 # v6
        with:
          context: labs/lab-02
          push: false
          load: true
          tags: ai381-churn-api:${{ github.sha }}

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ai381-churn-api:${{ github.sha }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH

      - name: Login to GitHub Container Registry
        uses: docker/login-action@184bdaa0721073962dff0199f1fb9940f07167d1 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag and push image to GHCR
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/ai381-churn-api"
          docker tag ai381-churn-api:${GITHUB_SHA} ${IMAGE}:${GITHUB_SHA}
          docker push ${IMAGE}:${GITHUB_SHA}
